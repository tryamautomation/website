<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040810"/>
      <stop offset="50%" stop-color="#070E1A"/>
      <stop offset="100%" stop-color="#0B0314"/>
    </linearGradient>

    <!-- Brand Cyan-Purple Glow Gradient -->
    <linearGradient id="brandGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>

    <!-- Glowing Text Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Radial Orbs -->
    <radialGradient id="orbTopRight" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.25)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    
    <radialGradient id="orbBottomLeft" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="rgba(112, 0, 255, 0.2)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#orbTopRight)"/>
  <rect width="1200" height="630" fill="url(#orbBottomLeft)"/>

  <!-- Subtle Cyber Grid Overlay -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200 M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>

  <!-- Neural Connection Nodes & Lines Visual in Background -->
  <g stroke="rgba(0, 240, 255, 0.15)" stroke-width="1.5">
    <line x1="850" y1="180" x2="1020" y2="280"/>
    <line x1="1020" y1="280" x2="940" y2="440"/>
    <line x1="940" y1="440" x2="780" y2="350"/>
    <line x1="780" y1="350" x2="850" y2="180"/>
    <line x1="850" y1="180" x2="940" y2="440"/>
  </g>
  <circle cx="850" cy="180" r="8" fill="#00F0FF" filter="url(#neonGlow)"/>
  <circle cx="1020" cy="280" r="10" fill="#38BDF8" filter="url(#neonGlow)"/>
  <circle cx="940" cy="440" r="9" fill="#7000FF" filter="url(#neonGlow)"/>
  <circle cx="780" cy="350" r="7" fill="#00F0FF" filter="url(#neonGlow)"/>

  <!-- Outer Glass Panel Card -->
  <rect x="70" y="60" width="1060" height="510" rx="24" fill="rgba(12, 20, 36, 0.5)" stroke="rgba(0, 240, 255, 0.2)" stroke-width="2"/>

  <!-- Header Badge -->
  <g transform="translate(110, 115)">
    <rect width="320" height="42" rx="21" fill="rgba(0, 240, 255, 0.1)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5"/>
    <circle cx="26" cy="21" r="5" fill="#27C93F"/>
    <text x="44" y="26" fill="#00F0FF" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">AUTONOMOUS AI SWARMS</text>
  </g>

  <!-- Main Headline -->
  <text x="110" y="235" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" letter-spacing="-1">
    TRYAM AUTOMATIONS
  </text>
  
  <text x="110" y="305" fill="url(#brandGlow)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" filter="url(#neonGlow)">
    Beyond Linear Workflows. Goal-Driven AI.
  </text>

  <!-- Subtitle Text -->
  <text x="110" y="375" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="22" font-weight="400">
    Architecting Autonomous Agentic AI Swarms &amp; Custom High-Throughput CRMs.
  </text>

  <!-- Bottom Metric Pills -->
  <g transform="translate(110, 445)">
    <!-- Pill 1 -->
    <rect width="210" height="60" rx="14" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="24" y="36" fill="#00F0FF" font-family="monospace" font-size="24" font-weight="800">100%</text>
    <text x="95" y="34" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Goal-Driven</text>

    <!-- Pill 2 -->
    <g transform="translate(230, 0)">
      <rect width="210" height="60" rx="14" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="24" y="36" fill="#00F0FF" font-family="monospace" font-size="24" font-weight="800">10x</text>
      <text x="80" y="34" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Auto-Speed</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(460, 0)">
      <rect width="240" height="60" rx="14" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="24" y="36" fill="#00F0FF" font-family="monospace" font-size="24" font-weight="800">&lt;300ms</text>
      <text x="135" y="34" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">AI Latency</text>
    </g>

    <!-- URL Tag -->
    <g transform="translate(720, 15)">
      <text x="160" y="24" fill="#38BDF8" font-family="monospace" font-size="18" font-weight="700" text-anchor="end">tryamautomation.com</text>
    </g>
  </g>
</svg>
